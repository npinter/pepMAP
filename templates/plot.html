<!DOCTYPE html>
<html lang="en">
<head>
    <title>pepMAP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #414141;
            width: 25px;
            height: 25px;
            animation: spin 2s linear infinite;
            margin: auto;
        }
        .button-loader {
            width: 8px;
            height: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #peptides_plot, #features_plot {
            display: none;
            margin-top: 10px;
        }
        .form-container {
            display: inline-block;
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            text-align: left;
            width: 600px;
        }
        .timer_container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
        }
        .form-group label {
            margin-right: 10px;
            flex: 0 0 40%;
            text-align: right;
        }
        .form-group input,
        .form-group select {
            text-align: left;
            flex: 1;
        }
        .form-group button
        {
            flex: 1;
        }
        input[type="text"],
        input[type="file"],
        button {
            width: 100%;
        }
        .error-message {
            color: red;
            margin-top: 20px;
        }
        .hidden {
            display: none;
        }
        .data-filenames {
            font-size: 12px;
        }
        #proteotypic_container input[type="checkbox"] {
            flex: 0;
            margin-left: 0;
            margin-right: auto;
        }
        #fasta_filename, #report_filename, #custom_features_filename {
            flex: 0;
            margin-left: 0;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <h1>pepMAP</h1>
    <div class="form-container">
        <form>
            <div class="form-group">
                <label for="report_file">Report file:</label>
                <input type="file" id="report_file" name="report_file">
                <span id="report_filename" class="hidden data-filenames"></span>
            </div>
            <div class="form-group">
                <label for="fasta_file">FASTA Database:</label>
                <input type="file" id="fasta_file" name="fasta_file">
                <span id="fasta_filename" class="hidden data-filenames"></span>
            </div>
            <div class="form-group">
                <label for="organism">Organism:</label>
                <select id="organism" name="organism">
                    <option value="HUMAN">Human</option>
                    <option value="MOUSE">Mouse</option>
                </select>
            </div>
            <div class="form-group">
                <label for="custom_features_file">Custom features:</label>
                <input type="file" id="custom_features_file" name="custom_features_file" accept=".tsv,.txt,text/tab-separated-values">
                <span id="custom_features_filename" class="hidden data-filenames"></span>
            </div>
            <div class="form-group hidden" id="custom_features_label_container">
                <label for="custom_features_label">Custom label:</label>
                <input type="text" id="custom_features_label" name="custom_features_label" placeholder="e.g. Antibody Epitopes">
            </div>
            <div class="form-group" id="proteotypic_container">
                <label for="proteotypic_checkbox">Proteotypic:</label>
                <input type="checkbox" id="proteotypic_checkbox" name="proteotypic_checkbox">
            </div>
            <div class="form-group" id="sample_name_container">
                <label for="sample_name_cleanup">Sample name:</label>
                <select id="sample_name_cleanup" name="sample_name_cleanup">
                    <option value="none">Keep as-is</option>
                    <option value="strip_evosep">Remove EvoSep position</option>
                    <option value="custom">Custom split</option>
                </select>
            </div>
            <div class="form-group hidden" id="sample_name_custom_container">
                <label for="sample_name_custom_pattern">Split pattern:</label>
                <input type="text" id="sample_name_custom_pattern" name="sample_name_custom_pattern" placeholder="e.g. _ or -">
            </div>
            <div class="form-group">
                <button type="button" id="upload_button">Upload Files</button>
                <button type="button" id="new_report_button" class="hidden">New Report</button>
            </div>
            <div class="form-group hidden" id="search_container">
                <label for="search_input">Gene name:</label>
                <input type="text" id="search_input" name="search_input" placeholder="Gene name or UniProt ID" list="gene_suggestions">
                <datalist id="gene_suggestions"></datalist>
                <button type="button" id="submit_button">Map Peptides</button>
                <button type="button" id="edit_title_button" title="Edit title">
                    <i class="fa-solid fa-pen"></i>
                </button>
            </div>
            <div class="form-group hidden" id="custom_title_container">
                <label for="custom_title_input">Plot title:</label>
                <input type="text" id="custom_title_input" name="custom_title_input" placeholder="Custom gene name (display only)">
                <button type="button" id="clear_title_button">Reset title</button>
            </div>
            <div class="form-group hidden" id="stats_container">
                <button type="button" id="show_all_stats_button">Show all stats</button>
                <button type="button" id="clear_stats_button">Clear stats</button>
            </div>
            <div class="timer_container">
                <div id="timer" class="timer hidden">Session will expire in 30:00 minutes</div>
            </div>
        </form>
    </div>

    <div id="peptides_plot"><div class="loader"></div></div>
    <div id="features_plot"><div class="loader"></div></div>

    <script>
        let sessionTime = 1800;
        let sessionId = null;
        let timeoutInterval;
        let persistentHoverLayer = null;
        let hasCustomFeatures = false;
        let customFeaturesLabel = '';

        function applySessionData(data) {
            sessionId = data.session_id;
            if (data.report_filename) {
                document.getElementById('report_filename').textContent = data.report_filename;
                document.getElementById('report_filename').classList.remove('hidden');
                document.getElementById('report_file').classList.add('hidden');
            }
            if (data.fasta_filename) {
                document.getElementById('fasta_filename').textContent = data.fasta_filename;
                document.getElementById('fasta_filename').classList.remove('hidden');
                document.getElementById('fasta_file').classList.add('hidden');
            }
            if (data.organism) {
                const organismSelect = document.getElementById('organism');
                const optionValues = Array.from(organismSelect.options).map(option => option.value);
                if (optionValues.includes(data.organism)) {
                    organismSelect.value = data.organism;
                    organismSelect.disabled = true;
                }
            }

            hasCustomFeatures = Boolean(data.has_custom_features);
            customFeaturesLabel = data.custom_features_label || '';
            if (hasCustomFeatures) {
                if (data.custom_features_filename) {
                    document.getElementById('custom_features_filename').textContent = data.custom_features_filename;
                    document.getElementById('custom_features_filename').classList.remove('hidden');
                    document.getElementById('custom_features_file').classList.add('hidden');
                }
                document.getElementById('custom_features_label').value = customFeaturesLabel;
                document.getElementById('custom_features_label').disabled = true;
                document.getElementById('custom_features_label_container').classList.remove('hidden');
            } else {
                document.getElementById('custom_features_label_container').classList.add('hidden');
            }

            document.getElementById('upload_button').classList.add('hidden');
            document.getElementById('search_container').classList.remove('hidden');
            document.getElementById('new_report_button').classList.remove('hidden');
            document.getElementById('timer').classList.remove('hidden');
            resetTimer();
        }

        function startTimer(duration, display) {
            let timer = duration, minutes, seconds;
            let interval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = 'Session will expire in ' + minutes + ":" + seconds + ' minutes';

                if (--timer < 0) {
                    clearInterval(interval);
                    if (!sessionId) {
                        location.reload();
                        return;
                    }
                    const formData = new FormData();
                    formData.append('session_id', sessionId);
                    fetch('/flush', { method: 'POST', body: formData })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Session flushed:', data);
                        location.reload();
                    })
                    .catch(error => console.error('Error flushing session:', error));
                }
            }, 1000);
            return interval;
        }

        function resetTimer() {
            clearTimeout(timeoutInterval);
            let display = document.querySelector('#timer');
            timeoutInterval = startTimer(sessionTime, display);
        }

        function stopTimer() {
            clearTimeout(timeoutInterval);
        }

        function resetFormState() {
            const form = document.querySelector('form');
            if (form) {
                form.reset();
            }
            $('#gene_suggestions').empty();
            $('#custom_title_container').addClass('hidden');
            $('#sample_name_custom_container').addClass('hidden');
            $('#stats_container').addClass('hidden');
            $('#custom_features_filename').addClass('hidden').text('');
            $('#custom_features_file').removeClass('hidden').val('');
            $('#custom_features_label').prop('disabled', false).val('');
            $('#custom_features_label_container').addClass('hidden');
            hasCustomFeatures = false;
            customFeaturesLabel = '';
            sessionId = null;
        }

        window.onload = function () {
            resetFormState();
            var display = document.querySelector('#timer');
            if (!display.classList.contains('hidden')) {
                startTimer(sessionTime, display);
            }

            const params = new URLSearchParams(window.location.search);
            const providedSessionId = params.get('session_id');
            if (providedSessionId) {
                fetch('/session_info?session_id=' + encodeURIComponent(providedSessionId))
                    .then(response => {
                        if (!response.ok) {
                            return response.json().then(data => {
                                throw new Error(data.error || 'Failed to load session.');
                            });
                        }
                        return response.json();
                    })
                    .then(data => {
                        applySessionData(data);
                    })
                    .catch(error => {
                        console.error('Session load error:', error);
                        alert(error.message);
                    });
            }
        };

        document.getElementById('search_input').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                document.getElementById('submit_button').click();
            }
        });

        document.getElementById('upload_button').addEventListener('click', function() {
            let formData = new FormData();
            let uploadButton = document.getElementById('upload_button');
            let originalButtonHtml = uploadButton.innerHTML;
            uploadButton.innerHTML = '<div class="loader button-loader"></div>';
            uploadButton.disabled = true;

            formData.append('report_file', document.getElementById('report_file').files[0]);
            formData.append('fasta_file', document.getElementById('fasta_file').files[0]);
            formData.append('organism', document.getElementById('organism').value);
            formData.append('custom_features_file', document.getElementById('custom_features_file').files[0]);
            formData.append('custom_features_label', document.getElementById('custom_features_label').value);

            fetch('/upload', {
                method: 'POST',
                body: formData,
            }).then(response => {
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.error || 'Upload failed');
                    });
                }
                return response.json();
            })
              .then(data => {
                  sessionId = data.session_id;
                  document.getElementById('report_filename').textContent = document.getElementById('report_file').files[0].name;
                  document.getElementById('fasta_filename').textContent = document.getElementById('fasta_file').files[0].name;
                  document.getElementById('report_filename').classList.remove('hidden');
                  document.getElementById('fasta_filename').classList.remove('hidden');
                  document.getElementById('report_file').classList.add('hidden');
                  document.getElementById('fasta_file').classList.add('hidden');
                  document.getElementById('organism').disabled = true;
                  uploadButton.classList.add('hidden');
                  document.getElementById('search_container').classList.remove('hidden');
                  document.getElementById('new_report_button').classList.remove('hidden');
                  document.getElementById('timer').classList.remove('hidden');
                  resetTimer();
                  hasCustomFeatures = Boolean(data.custom_features_uploaded);
                  customFeaturesLabel = data.custom_features_label || '';
                  if (hasCustomFeatures) {
                      document.getElementById('custom_features_filename').textContent = document.getElementById('custom_features_file').files[0].name;
                      document.getElementById('custom_features_filename').classList.remove('hidden');
                      document.getElementById('custom_features_file').classList.add('hidden');
                      document.getElementById('custom_features_label').value = customFeaturesLabel;
                      document.getElementById('custom_features_label').disabled = true;
                      document.getElementById('custom_features_label_container').classList.remove('hidden');
                  } else {
                      document.getElementById('custom_features_label_container').classList.add('hidden');
                  }
              })
              .catch(error => {
                  console.error('Error:', error);
                  alert(error.message);
              })
              .finally(() => {
                  uploadButton.innerHTML = originalButtonHtml;
                  uploadButton.disabled = false;
              });
        });

        document.getElementById('new_report_button').addEventListener('click', function() {
            const formData = new FormData();
            if (sessionId) {
                formData.append('session_id', sessionId);
            }
            fetch('/flush', {
                method: 'POST',
                body: formData
            }).then(() => {
                document.getElementById('report_file').classList.remove('hidden');
                document.getElementById('fasta_file').classList.remove('hidden');
                document.getElementById('custom_features_file').classList.remove('hidden');
                document.getElementById('custom_features_file').value = '';
                document.getElementById('organism').disabled = false;
                document.getElementById('upload_button').classList.remove('hidden');
                document.getElementById('report_filename').classList.add('hidden');
                document.getElementById('fasta_filename').classList.add('hidden');
                document.getElementById('custom_features_filename').classList.add('hidden');
                document.getElementById('custom_features_label').disabled = false;
                document.getElementById('custom_features_label').value = '';
                document.getElementById('custom_features_label_container').classList.add('hidden');
                document.getElementById('search_container').classList.add('hidden');
                document.getElementById('new_report_button').classList.add('hidden');
                document.getElementById('peptides_plot').style.display = 'none';
                document.getElementById('features_plot').style.display = 'none';
                document.getElementById('timer').classList.add('hidden');
                document.getElementById('stats_container').classList.add('hidden');
                hasCustomFeatures = false;
                customFeaturesLabel = '';
                sessionId = null;
                stopTimer();
            });
        });

        document.getElementById('custom_features_file').addEventListener('change', function() {
            const hasFile = this.files && this.files.length > 0;
            if (hasFile) {
                document.getElementById('custom_features_label_container').classList.remove('hidden');
            } else {
                document.getElementById('custom_features_label_container').classList.add('hidden');
                document.getElementById('custom_features_label').value = '';
            }
        });

        function fetchPlots() {
            $('#peptides_plot, #features_plot').show().html('<div class="loader"></div>');

            let formData = new FormData();
            if (sessionId) {
                formData.append('session_id', sessionId);
            }
            formData.append('search_input', $('#search_input').val());
            formData.append('proteotypic_checkbox', $('#proteotypic_checkbox').is(':checked'));
            formData.append('sample_name_cleanup', $('#sample_name_cleanup').val());
            formData.append('sample_name_custom_pattern', $('#sample_name_custom_pattern').val());
            formData.append('custom_title', $('#custom_title_input').val());

            $.ajax({
                url: '/plot_peptides',
                type: 'POST',
                data: formData,
                contentType: false,
                processData: false,
                success: function(data) {
                    $('#peptides_plot').html(data);
                    applyCrispEdges();
                    var peptidePlotDiv = document.getElementById('peptides_plot').getElementsByClassName('js-plotly-plot')[0];
                    if (peptidePlotDiv) {
                        setupPersistentHover(peptidePlotDiv);
                        document.getElementById('stats_container').classList.remove('hidden');
                    }
                },
                error: function(xhr) {
                    let errorMsg = 'Failed to load peptides plot.';
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        errorMsg += ' (' + xhr.responseJSON.error + ')';
                    } else {
                        errorMsg += ' (Unknown Error)';
                    }
                    errorMsg = '<div class="error-message">' + errorMsg + '</div>';
                    $('#peptides_plot').html(errorMsg);
                    document.getElementById('stats_container').classList.add('hidden');
                }
            });

            $.ajax({
                url: '/plot_features',
                type: 'POST',
                data: formData,
                contentType: false,
                processData: false,
                success: function(data) {
                    $('#features_plot').html(data);
                    const featurePlotDiv = document.getElementById('features_plot').getElementsByClassName('js-plotly-plot')[0];
                    if (featurePlotDiv) {
                        setupPersistentHover(featurePlotDiv);
                    }
                },
                error: function(xhr) {
                    let errorMsg = 'Failed to load features plot.';
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        errorMsg += ' (' + xhr.responseJSON.error + ')';
                    } else {
                        errorMsg += ' (Unknown Error)';
                    }
                    errorMsg = '<div class="error-message">' + errorMsg + '</div>';
                    $('#features_plot').html(errorMsg);
                }
            });

        }

        function getPersistentHoverLayer(plotDiv) {
            const mainSvgs = plotDiv.querySelectorAll('.main-svg');
            if (mainSvgs.length === 0) {
                console.error("No main SVG elements found in plot");
                return null;
            }

            const targetSvg = mainSvgs[1] || mainSvgs[0];
            const layerAbove = targetSvg.querySelector('.layer-above');
            if (!layerAbove) {
                console.error("Layer-above element not found in plot");
                return null;
            }

            let persistentHoverLayer = layerAbove.querySelector('.persistent-hoverlayer');
            if (!persistentHoverLayer) {
                persistentHoverLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
                persistentHoverLayer.classList.add("persistent-hoverlayer");
                const shapelayer = layerAbove.querySelector('.shapelayer');
                if (shapelayer) {
                    shapelayer.after(persistentHoverLayer);
                } else {
                    layerAbove.appendChild(persistentHoverLayer);
                }
            }

            return persistentHoverLayer;
        }

        function setupPersistentHover(plotDiv) {
            const persistentHoverLayer = getPersistentHoverLayer(plotDiv);
            if (!persistentHoverLayer) {
                return;
            }

            plotDiv.on('plotly_click', function(data) {
                const hoverLayer = plotDiv.getElementsByClassName("hoverlayer")[0];
                if (hoverLayer) {
                    const hoverBox = hoverLayer.getElementsByClassName("hovertext")[0];
                    if (hoverBox) {
                        const existingHoverBox = Array.from(persistentHoverLayer.children).find(child =>
                            child.textContent === hoverBox.textContent
                        );

                        if (existingHoverBox) {
                            existingHoverBox.remove();
                        } else {
                            const persistentHoverBox = hoverBox.cloneNode(true);
                            persistentHoverBox.style.pointerEvents = 'all';

                            // generate a unique id for the hover box
                            const hoverBoxId = 'hover-' + Date.now();
                            persistentHoverBox.setAttribute('id', hoverBoxId);

                            persistentHoverBox.addEventListener('click', function(e) {
                                e.stopPropagation();
                                this.remove();
                            });

                            persistentHoverLayer.appendChild(persistentHoverBox);
                        }
                    }
                }
            });
        }

        function clearPersistentHoverLayer(plotDiv) {
            const persistentHoverLayer = getPersistentHoverLayer(plotDiv);
            if (persistentHoverLayer) {
                persistentHoverLayer.innerHTML = '';
            }
        }

        function cloneHoverBoxesToPersistent(plotDiv, persistentHoverLayer) {
            const hoverLayer = plotDiv.getElementsByClassName("hoverlayer")[0];
            if (!hoverLayer) {
                return;
            }
            const hoverBoxes = hoverLayer.getElementsByClassName("hovertext");
            Array.from(hoverBoxes).forEach(hoverBox => {
                const existingHoverBox = Array.from(persistentHoverLayer.children).find(child =>
                    child.textContent === hoverBox.textContent
                );
                if (!existingHoverBox) {
                    const persistentHoverBox = hoverBox.cloneNode(true);
                    persistentHoverBox.style.pointerEvents = 'all';
                    const hoverBoxId = 'hover-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
                    persistentHoverBox.setAttribute('id', hoverBoxId);
                    persistentHoverBox.addEventListener('click', function(e) {
                        e.stopPropagation();
                        this.remove();
                    });
                    persistentHoverLayer.appendChild(persistentHoverBox);
                }
            });
        }

        function getPeptidePlotDiv() {
            const peptidesPlot = document.getElementById('peptides_plot');
            if (!peptidesPlot) {
                return null;
            }
            return peptidesPlot.getElementsByClassName('js-plotly-plot')[0];
        }

        function collectPlotPoints(plotDiv) {
            const points = [];
            if (!plotDiv || !plotDiv._fullData) {
                return points;
            }
            plotDiv._fullData.forEach((trace, traceIndex) => {
                const pointCount = trace.x ? trace.x.length : 0;
                for (let i = 0; i < pointCount; i++) {
                    points.push({ curveNumber: traceIndex, pointNumber: i });
                }
            });
            return points;
        }

        function showAllStats(plotDiv) {
            if (!plotDiv || !window.Plotly) {
                return;
            }
            const persistentHoverLayer = getPersistentHoverLayer(plotDiv);
            if (!persistentHoverLayer) {
                return;
            }

            clearPersistentHoverLayer(plotDiv);
            const points = collectPlotPoints(plotDiv);
            if (points.length === 0) {
                return;
            }

            let currentIndex = 0;
            const step = function() {
                if (currentIndex >= points.length) {
                    Plotly.Fx.unhover(plotDiv);
                    return;
                }
                Plotly.Fx.hover(plotDiv, [points[currentIndex]]);
                setTimeout(function() {
                    cloneHoverBoxesToPersistent(plotDiv, persistentHoverLayer);
                    Plotly.Fx.unhover(plotDiv);
                    currentIndex += 1;
                    setTimeout(step, 0);
                }, 0);
            };
            step();
        }

        function applyCrispEdges() {
            const colorbarGroups = document.querySelectorAll('g.colorbar');
            colorbarGroups.forEach(group => {
                const rects = group.querySelectorAll('rect');
                rects.forEach(rect => {
                    rect.setAttribute('shape-rendering', 'crispEdges');
                });
            });
            const shapeGroups = document.querySelectorAll('g.shapelayer');
            shapeGroups.forEach(group => {
                const shapes = group.querySelectorAll('path');
                shapes.forEach(shape => {
                    shape.setAttribute('shape-rendering', 'crispEdges');
                });
            });
        }

        $(document).ready(function() {
            $('#submit_button').click(function(e) {
                e.preventDefault();
                fetchPlots();
                resetTimer();
            });

            $('#edit_title_button').click(function(e) {
                e.preventDefault();
                $('#custom_title_container').toggleClass('hidden');
                if (!$('#custom_title_container').hasClass('hidden')) {
                    $('#custom_title_input').focus();
                }
            });

            $('#clear_title_button').click(function(e) {
                e.preventDefault();
                $('#custom_title_input').val('');
            });

            $('#search_input').on('input', function() {
                const query = $(this).val().trim();
                if (!query) {
                    $('#gene_suggestions').empty();
                    return;
                }

                const sessionQuery = sessionId ? '&session_id=' + encodeURIComponent(sessionId) : '';
                fetch('/autocomplete?query=' + encodeURIComponent(query) + sessionQuery)
                    .then(response => response.json())
                    .then(data => {
                        const options = (data.suggestions || []).map(suggestion =>
                            '<option value="' + suggestion + '"></option>'
                        );
                        $('#gene_suggestions').html(options.join(''));
                    })
                    .catch(error => console.error('Autocomplete error:', error));
            });

            $('#sample_name_cleanup').on('change', function() {
                const isCustom = $(this).val() === 'custom';
                $('#sample_name_custom_container').toggleClass('hidden', !isCustom);
            });

            $('#show_all_stats_button').click(function(e) {
                e.preventDefault();
                showAllStats(getPeptidePlotDiv());
            });

            $('#clear_stats_button').click(function(e) {
                e.preventDefault();
                clearPersistentHoverLayer(getPeptidePlotDiv());
            });
        });
    </script>
</body>
</html>
